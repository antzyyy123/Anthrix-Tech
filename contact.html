<!DOCTYPE html>
<html lang="en" data-theme="brand">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Anthrix Tech</title>
  <link rel="icon" href="images/favicon.ico" sizes="any">
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("theme");
        if (saved && ["brand", "dark", "light"].indexOf(saved) !== -1) {
          document.documentElement.setAttribute("data-theme", saved);
        } else {
          document.documentElement.setAttribute("data-theme", "brand");
        }
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "brand");
      }
    })();
  </script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjlE5O8YJ+8z8zYJp9BZK7B2qG8W7S5hF7Z5K6B8C9D9E9F9A9B9C9D9E9F9A9B9C9D9E9F9A9B9C9" crossorigin="anonymous">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/bubble-nav.css">
</head>
<body>
  <div data-component="top-nav"></div>

  <main>
    <section id="contact" class="contact-section">
      <div class="container">
        <div class="contact-inner" id="book-a-call">
          <div class="contact-info">
            <h2>Get in touch</h2>
            <p>Building a capstone or thesis system, or need a website for your business? Tell us what you have in mind, and we'll get back to you.</p>
            <a class="btn btn-primary" href="book-a-call.html">Book a call</a>
            <ul class="contact-details">
              <li><strong>Email:</strong> anthonyojera02@gmail.com</li>
              <li><strong>Location:</strong> Iloilo, Philippines</li>
            </ul>
          </div>

          <form id="contactForm" class="contact-form" novalidate action="https://formspree.io/f/mqppoldb" method="POST">
            <p class="call-booking-summary" id="callBookingSummary" hidden></p>
            <h2>Send a message</h2>
            <input type="hidden" id="callDate" name="call_date" value="">
            <input type="hidden" id="callTime" name="call_time" value="">

            <div class="form-row">
              <div class="field">
                <label for="name">Name <span class="req">*</span></label>
                <input type="text" id="name" name="name" placeholder="Dela Cruz, Juan P." required minlength="2" pattern="[A-Za-zÀ-ÖØ-öø-ÿ][A-Za-zÀ-ÖØ-öø-ÿ.'-]*(?: [A-Za-zÀ-ÖØ-öø-ÿ][A-Za-zÀ-ÖØ-öø-ÿ.'-]*)*,\s*[A-Za-zÀ-ÖØ-öø-ÿ][A-Za-zÀ-ÖØ-öø-ÿ'-]*(?: [A-Za-zÀ-ÖØ-öø-ÿ][A-Za-zÀ-ÖØ-öø-ÿ'-]*)*(?:\s+[A-Za-z]\.)?" aria-invalid="false" aria-describedby="nameError">
                <span class="error" id="nameError" aria-live="polite"></span>
              </div>
              <div class="field">
                <label for="email">Email <span class="req">*</span></label>
                <input type="email" id="email" name="email" placeholder="juan@your-school.edu.ph" required maxlength="254" aria-invalid="false" aria-describedby="emailError">
                <span class="error" id="emailError" aria-live="polite"></span>
              </div>
            </div>

            <div class="field full">
              <label for="project">Project <span class="req">*</span></label>
              <select id="project" name="project" required aria-invalid="false" aria-describedby="projectError">
                <option value="" selected disabled>Select project type</option>
                <option value="capstone-thesis-system">Capstone / thesis system</option>
                <option value="custom-website">Custom website</option>
                <option value="business-website-landing-page">Business website or landing page</option>
                <option value="inventory-pos-sales-system">Inventory / POS / sales system</option>
                <option value="mobile-app">Mobile app</option>
                <option value="other">Other (not listed)</option>
              </select>
              <span class="error" id="projectError" aria-live="polite"></span>
            </div>

            <div class="form-row">
              <div class="field">
                <label for="budget">Budget</label>
                <select id="budget" name="budget" aria-invalid="false" aria-describedby="budgetError">
                  <option value="">Select budget range</option>
                  <option value="under-5k">Under ₱5,000</option>
                  <option value="5k-15k">₱5,000 &ndash; ₱15,000</option>
                  <option value="15k-30k">₱15,000 &ndash; ₱30,000</option>
                  <option value="30k-60k">₱30,000 &ndash; ₱60,000</option>
                  <option value="over-60k">Over ₱60,000</option>
                  <option value="not-sure">Not sure yet</option>
                </select>
                <span class="error" id="budgetError" aria-live="polite"></span>
              </div>
              <div class="field">
                <label for="timeline">Time line</label>
                <select id="timeline" name="timeline" aria-invalid="false" aria-describedby="timelineError">
                  <option value="">Select time line</option>
                  <option value="asap">As soon as possible</option>
                  <option value="1-month">Within 1 month</option>
                  <option value="3-months">Within 3 months</option>
                  <option value="6-months">Within 6 months</option>
                  <option value="flexible">Flexible</option>
                </select>
                <span class="error" id="timelineError"></span>
              </div>
            </div>

            <div class="field full">
              <label for="building">What are you building? <span class="req">*</span></label>
              <textarea id="building" name="building" rows="5" placeholder="For example: a thesis system for tracking clinic appointments, or a website for my shop. What should it help people do?" required minlength="10" aria-invalid="false" aria-describedby="buildingError"></textarea>
              <span class="error" id="buildingError" aria-live="polite"></span>
            </div>

            <button type="submit" class="btn btn-primary btn-submit" id="submitBtn">Send message</button>
            <div class="form-message" id="formMessage"></div>
          </form>
        </div>
      </div>
    </section>
  </main>
  <div data-component="footer"></div>
  <script src="js/components.js"></script>
  <script src="js/script.js"></script>
  <script src="js/bubble-nav.js" defer></script>
</body>
</html>
