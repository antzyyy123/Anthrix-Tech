<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#202124">
  <title>Source Viewer Mockup</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Arial, sans-serif;
      background: #1e1e1e;
      color: #d4d4d4;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }

    button {
      display: grid;
      width: 36px;
      height: 36px;
      flex: 0 0 36px;
      place-items: center;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: #bdc1c6;
    }

    button svg {
      width: 19px;
      height: 19px;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.8;
    }

    .viewer {
      display: flex;
      width: 100%;
      height: 100%;
      flex-direction: column;
      background: #1e1e1e;
    }

    .browser-bar {
      display: flex;
      min-height: 56px;
      align-items: center;
      gap: 8px;
      padding: 0 12px;
      background: #202124;
    }

    .browser-controls,
    .browser-actions {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 4px;
    }

    .browser-controls .disabled {
      color: #686b70;
    }

    .address-bar {
      display: flex;
      min-width: 0;
      height: 38px;
      flex: 1 1 auto;
      align-items: center;
      gap: 10px;
      padding: 0 14px;
      overflow: hidden;
      border: 1px solid transparent;
      border-radius: 22px;
      background: #303134;
      color: #e8eaed;
      font-size: 14px;
      white-space: nowrap;
    }

    .info-icon {
      flex: 0 0 auto;
      color: #bdc1c6;
      font-size: 16px;
      line-height: 1;
    }

    .address-text {
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .browser-actions {
      gap: 2px;
    }

    .profile-avatar {
      width: 27px;
      height: 27px;
      flex: 0 0 27px;
      margin: 0 5px 0 8px;
      border-radius: 50%;
      background: #8ab4f8;
      color: #202124;
      font-size: 14px;
      font-weight: 700;
      line-height: 27px;
      text-align: center;
    }

    .toolbar {
      display: flex;
      min-height: 42px;
      align-items: center;
      padding: 0 16px;
      border-bottom: 1px solid #3c4043;
      background: #202124;
      color: #e8eaed;
      font-size: 13px;
    }

    .wrap-toggle {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;
    }

    .wrap-toggle input {
      width: 14px;
      height: 14px;
      margin: 0;
      accent-color: #8ab4f8;
    }

    .code-area {
      flex: 1 1 auto;
      min-height: 0;
      overflow: auto;
      background: #1e1e1e;
    }

    .code-text {
      min-height: 100%;
      margin: 0;
      padding: 14px 12px;
      color: #d4d4d4;
      font: 13px/1.5 Consolas, "Courier New", monospace;
      white-space: pre;
    }

    .code-text.is-wrapped {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    @media (max-width: 600px) {
      .browser-bar {
        gap: 4px;
        padding: 0 6px;
      }

      .browser-controls,
      .browser-actions {
        gap: 0;
      }

      .browser-bar button {
        width: 32px;
        flex-basis: 32px;
      }

      .browser-actions .optional-action {
        display: none;
      }

      .address-bar {
        gap: 7px;
        padding: 0 10px;
        font-size: 12px;
      }
    }
  </style>
</head>
<body>
  <main class="viewer" aria-label="Source viewer mockup">
    <header class="browser-bar" aria-label="Mock browser toolbar">
      <nav class="browser-controls" aria-label="Navigation controls">
        <button type="button" aria-label="Back">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <button type="button" class="disabled" aria-label="Forward" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
        </button>
        <button type="button" aria-label="Reload">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14.9-3M4 4v4h4"/><path d="M4 13a8 8 0 0 0 14.9 3M20 20v-4h-4"/></svg>
        </button>
      </nav>

      <div class="address-bar" aria-label="Displayed URL">
        <span class="info-icon" aria-hidden="true">ⓘ</span>
        <span class="address-text">view-source:https://anthrixtech.onrender.com/</span>
      </div>

      <div class="browser-actions" aria-label="Browser actions">
        <button type="button" aria-label="Bookmark">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9L12 3Z"/></svg>
        </button>
        <button type="button" class="optional-action" aria-label="Extensions">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3h4v3h3V7h3V3H8Z"/><path d="M16 3v4h5v3h-4v3h4v6a2 2 0 0 1-2 2h-6v-4h-3v4H5a2 2 0 0 1-2-2v-6h4v-3H3"/></svg>
        </button>
        <button type="button" class="optional-action" aria-label="Downloads">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5"/><path d="M5 17v3h14v-3"/></svg>
        </button>
        <span class="profile-avatar" aria-label="Profile">A</span>
      </div>
    </header>

    <div class="toolbar">
      <label class="wrap-toggle" for="line-wrap">
        <input id="line-wrap" type="checkbox">
        <span>Line wrap</span>
      </label>
    </div>

    <section class="code-area" aria-label="Sample source text">
      <pre class="code-text" id="code-text"></pre>
    </section>
  </main>

  <script>
    (function () {
      "use strict";

      var sourceText = '<!DOCTYPE html><html lang="en" class="dark"><head><meta charSet="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><link rel="preload" href="/_next/static/media/22a5144ee8d83bca-s.p.w';
      var codeText = document.getElementById("code-text");
      var lineWrap = document.getElementById("line-wrap");

      codeText.textContent = sourceText;
      lineWrap.addEventListener("change", function () {
        codeText.classList.toggle("is-wrapped", lineWrap.checked);
      });
    })();
  </script>
</body>
</html>
